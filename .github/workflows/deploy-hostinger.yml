# Deploys site/wp-content/ to the WordPress site on every push, through the Site Control plugin's API.
# One-time setup in GitHub: Settings > Secrets and variables > Actions > New repository secret:
#   AAUW_SITE_TOKEN   the deploy token from WordPress > Settings > Site Control > Create deploy token
# Optional repository variable AAUW_SITE_URL overrides the site address (set it to https://aauw-aami.org after the domain switch).
name: Deploy to site
on:
  push:
    branches: [ claude/find-mom-nonprofit-emails-bp820p, main ]
    paths: [ 'site/wp-content/**' ]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.AAUW_SITE_URL || 'https://silver-caribou-284529.hostingersite.com' }}
      SITE_TOKEN: ${{ secrets.AAUW_SITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check PHP
        run: |
          set -e
          find site/wp-content -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Deploy through the Site Control API
        run: |
          set -e
          if [ -z "$SITE_TOKEN" ]; then
            echo "::error title=Deploy not configured::Add the repository secret AAUW_SITE_TOKEN (WordPress > Settings > Site Control > Create deploy token)."
            exit 1
          fi
          cd site/wp-content
          zip -q -r ../../deploy.zip plugins themes -x '*.bak-*' '*.py' '*/.git*'
          cd ../..
          python3 - <<'PY'
          import base64, json, os, urllib.request
          site = os.environ['SITE_URL'].rstrip('/'); tok = os.environ['SITE_TOKEN']
          def call(path, body):
              req = urllib.request.Request(f"{site}/wp-json/aauw-control/v1/{path}", data=json.dumps(body).encode(),
                    headers={'Content-Type': 'application/json', 'X-AAUW-Token': tok, 'User-Agent': 'github-actions-deploy'}, method='POST')
              with urllib.request.urlopen(req, timeout=300) as r: return json.loads(r.read())
          z = base64.b64encode(open('deploy.zip', 'rb').read()).decode()
          print('unzip ->', call('unzip', {'zip_base64': z, 'to': 'wp-content'}))
          print('flush ->', call('cache/flush', {}))
          req = urllib.request.Request(f"{site}/wp-json/aauw-control/v1/ping", headers={'X-AAUW-Token': tok, 'User-Agent': 'github-actions-deploy'})
          with urllib.request.urlopen(req, timeout=60) as r: print('ping ->', json.loads(r.read())['ok'])
          PY
